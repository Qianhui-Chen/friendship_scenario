<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chatti 对话实验平台" />
    <title>Chatti</title>
    <link rel="stylesheet" href="styles.css?v=20261109c" />
  </head>
  <body>
    <section id="access-screen" class="access-screen" aria-labelledby="access-title">
      <div class="access-card">
        <span class="access-mark" aria-hidden="true">C</span>
        <p class="access-kicker">CONVERSATION STUDY</p>
        <h1 id="access-title">请输入问卷中生成的随机数</h1>
        <form id="access-form" class="access-form" novalidate>
          <label class="sr-only" for="condition-input">问卷中生成的随机数</label>
          <input
            id="condition-input"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            maxlength="1"
            placeholder="输入随机数"
            required
          />
          <button type="submit">进入对话</button>
        </form>
      </div>
    </section>

    <main id="experiment-platform" class="page-shell is-hidden" aria-hidden="true">
      <section class="chat-grid" aria-label="对话实验">
        <article class="chat-card" data-chat>
          <header class="chat-header">
            <span class="avatar" aria-hidden="true">C</span>
            <h1>Chatti</h1>
          </header>
          <div class="messages" aria-live="polite" aria-label="与 Chatti 的聊天记录"></div>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="chat-input">给 Chatti 发送消息</label>
            <textarea id="chat-input" rows="1" placeholder="简单说说你遇到的问题……" required></textarea>
            <button type="submit" aria-label="发送给 Chatti">发送</button>
          </form>
        </article>

        <aside class="scenario-card" aria-labelledby="scenario-title">
          <div class="scenario-content">
            <p class="scenario-label">CURRENT SITUATION</p>
            <h2 id="scenario-title">场景描述</h2>
            <p>你最近和你的朋友遭遇了信任危机：TA对你的消息总是爱答不理，回复得也不总是及时。有时候你主动分享生活中的事情，TA只是简单回复几个字，甚至直接忽略你的消息。你曾经试着询问TA是不是最近比较忙，或者你们之间是不是发生了什么问题，但TA总是表示一切正常，让你不要想太多。你开始觉得这段友谊似乎只有自己在主动维系，但又不确定TA是真的不在乎你，还是只是有不同的沟通习惯。</p>
          </div>
        </aside>
      </section>
    </main>

    <div id="error-modal" class="modal-layer is-hidden" role="alertdialog" aria-modal="true" aria-labelledby="error-title">
      <div class="modal-card modal-card-small">
        <span class="modal-icon" aria-hidden="true">!</span>
        <h2 id="error-title">输入有误</h2>
        <p>请输入正确的随机数格式。</p>
        <button id="error-close" type="button">重新输入</button>
      </div>
    </div>

    <template id="message-template">
      <div class="message-row"><div class="message-bubble"></div></div>
    </template>
    <script src="app.js?v=20261109b"></script>
  </body>
</html>
